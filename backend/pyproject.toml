[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: hits the real OpenAI API (needs OPENAI_API_KEY and OPENAI_MODEL)",
  "docker: needs a running Docker daemon and the loopforge-sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]
