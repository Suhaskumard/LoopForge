[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge-sdk"
version = "1.0.0rc1"
description = "Python client for the LoopForge API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
readme = "README.md"

[tool.setuptools]
packages = ["loopforge_sdk"]

[tool.setuptools.package-data]
loopforge_sdk = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"loopforge_sdk/client.py" = ["E501"]  # long return-type ignores on one-line REST wrappers
