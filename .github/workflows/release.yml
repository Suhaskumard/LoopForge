# Release: build the backend image, push it, SIGN it and attach provenance + SBOM (Phase 17, ADR-0024).
# Runs only on a version tag (or by hand). THIS WORKFLOW HAS NEVER RUN: it was written without a CI runner,
# so treat every step as unverified until the first tagged release succeeds and `scripts/verify_image.sh` passes.
#
# Keyless signing: the job's GitHub OIDC identity is the signing identity (Sigstore Fulcio), recorded in the
# Rekor transparency log. No private key is stored anywhere. `id-token: write` is granted to THIS job only.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # keyless cosign + build provenance
      attestations: write    # actions/attest-build-provenance
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/loopforge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: false     # the attestation step below produces the provenance
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SBOM (CycloneDX) attested to the image
        run: |
          pip install cyclonedx-bom==4.6.1
          cyclonedx-py requirements backend/requirements-runtime.txt --of JSON -o sbom-backend.json
          cosign attest --yes --type cyclonedx --predicate sbom-backend.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.json
