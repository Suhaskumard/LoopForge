name: CI
on: [push, pull_request]

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopforge
          POSTGRES_PASSWORD: loopforge
          POSTGRES_DB: loopforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopforge" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: Tests on SQLite (coverage floor)
        run: pytest -q --cov=app --cov-fail-under=95
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://loopforge:loopforge@localhost:5432/loopforge_test
        run: pytest -q
      - name: Migration up/down on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://loopforge:loopforge@localhost:5432/loopforge_test
        run: alembic upgrade head && alembic downgrade base
      - name: Benchmark tasks are sound (30, hidden tests)
        working-directory: .
        run: python benchmarks/validate_tasks.py
      - name: Benchmark regression subset (synthetic oracle) and report/defaults checks
        working-directory: .
        env:
          PYTHON: python
        run: |
          bash scripts/bench_regression.sh
          python benchmarks/check_report.py
          python benchmarks/check_defaults.py
      - name: Acceptance checklist (spec 15.1)
        working-directory: .
        run: python scripts/acceptance_check.py
      - name: Static security scan (bandit, medium and above fail the build)
        run: bandit -r app -ll -q
      - name: Crash-recovery drill (kill a real worker, another finishes the task)
        working-directory: .
        run: python scripts/chaos_drill.py
      - name: Backup and restore drill
        working-directory: .
        run: python scripts/backup_drill.py
      - name: Slow tests (live-server load and isolation smoke)
        run: pytest -q -m slow
      - name: Image builds
        working-directory: .
        run: docker build -t loopforge-backend backend

  # Phase 13: the same checks the Phase 13 gate runs locally, on a clean runner, from a clean checkout.
  # Real PostgreSQL 16: real Alembic up/down, PostgreSQL-only behaviour, the whole suite, the backup/restore scripts.
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: PostgreSQL suite (scripts/test_postgres.sh)
        run: PYTHON=python bash scripts/test_postgres.sh

  # The real Docker sandbox, and the containerised worker (socket proxy -> host daemon -> sandbox container).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Build the sandbox image
        run: docker build -t loopforge-sandbox backend/sandbox
      - name: Real sandbox tests (full loop in containers) and acceptance item 4
        working-directory: backend
        run: pytest -m docker -q
      - name: Acceptance checklist (item 4 must PASS here)
        run: python scripts/acceptance_check.py | tee /tmp/acc.txt && grep -q "\[PASS\] 4\." /tmp/acc.txt
      - name: Containerised worker smoke test
        run: PYTHON=python bash scripts/docker_worker_smoke.sh

  # OIDC against a real Keycloak (pinned image; dev mode; realm imported from backend/tests/fixtures/keycloak).
  oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Keycloak OIDC tests (scripts/test_keycloak.sh)
        run: PYTHON=python bash scripts/test_keycloak.sh

  # Supply chain: dependency vulnerabilities, SBOMs and an image scan. These need the network and are
  # reported by CI only; they were never run in the development environment.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency vulnerabilities (runtime requirements)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements-runtime.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend dependency vulnerabilities (production dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: SBOMs (CycloneDX)
        run: |
          pip install cyclonedx-bom==4.6.1
          cyclonedx-py requirements backend/requirements-runtime.txt --of JSON -o sbom-backend.json
          cd frontend && npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --omit dev --output-file ../sbom-frontend.json
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.json
      - name: Build the backend image
        run: docker build -t loopforge-backend:ci backend
      - name: Scan the image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loopforge-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm test
      - run: npm run build

  # Phase 15: real browser against the real API (scripted LLM/sandbox), accessibility and phone width.
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    services:
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real SMTP delivery (Mailpit)
        working-directory: backend
        env:
          SMTP_TEST_HOST: localhost
          SMTP_TEST_PORT: "1025"
          MAILPIT_API: http://localhost:8025
        run: pytest -q -p no:logging tests/integration/test_phase15_smtp.py
      - name: Playwright (desktop + mobile, axe)
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
